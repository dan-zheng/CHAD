[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chad"
version = "0.1.0"
description = "CHAD: Combinatory Homomorphic Automatic Differentiation, as a small Python library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]
license = { text = "BSD-3-Clause" }

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["chad"]
